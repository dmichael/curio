---
# Installs the resolver service. Assumes the IPFS and Arweave gateways already
# run on this host (they are separate concerns / separate roles).

# python3-packaging is required by Ansible's pip module itself.
- name: Ensure python venv support is present
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-packaging
    state: present
    update_cache: true

- name: Create resolver group
  ansible.builtin.group:
    name: "{{ resolver_group }}"
    system: true

- name: Create resolver system user
  ansible.builtin.user:
    name: "{{ resolver_user }}"
    group: "{{ resolver_group }}"
    system: true
    home: "{{ resolver_home }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: Create resolver directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ resolver_user }}"
    group: "{{ resolver_group }}"
    mode: "0755"
  loop:
    - "{{ resolver_home }}"
    - "{{ resolver_capture_dir }}"

# The build dir is scratch space, not managed state: wipe it first so a
# stale wheel from an earlier version can never be the one that ships.
- name: Clear the local wheel build dir
  ansible.builtin.file:
    path: "{{ playbook_dir }}/.build"
    state: absent
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false

# Built on the control machine so only the finished artifact travels — the
# build is a means to the copy below, not a state change on any host.
- name: Build the resolver wheel locally
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -m
      - pip
      - wheel
      - --no-deps
      - --wheel-dir
      - "{{ playbook_dir }}/.build"
      - "{{ playbook_dir }}/../resolver"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false

# Located by glob rather than a hardcoded filename so a version bump in
# pyproject.toml doesn't silently break the deploy.
- name: Locate the built wheel
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/.build"
    patterns: "content_resolver-*.whl"
  delegate_to: localhost
  become: false
  run_once: true
  register: resolver_wheel_find

- name: Require exactly one wheel
  ansible.builtin.assert:
    that: resolver_wheel_find.files | length == 1
    fail_msg: >-
      Expected exactly one content_resolver-*.whl in {{ playbook_dir }}/.build,
      found {{ resolver_wheel_find.files | length }}.
  run_once: true

# The wheel keeps its real filename: pip refuses wheels whose name doesn't
# parse as name-version-tags.whl, so a fixed alias like content-resolver.whl
# cannot be installed. Downstream tasks reuse this fact for the path.
- name: Ship the resolver wheel to the host
  ansible.builtin.copy:
    src: "{{ resolver_wheel_find.files[0].path }}"
    dest: "{{ resolver_home }}/{{ resolver_wheel_find.files[0].path | basename }}"
    owner: "{{ resolver_user }}"
    group: "{{ resolver_group }}"
    mode: "0644"
  notify: Restart content-resolver

# Locked dependency versions, generated with `pip freeze` from a working
# checkout — the same revision installs the same dependency set on any date.
- name: Write dependency constraints
  ansible.builtin.copy:
    src: constraints.txt
    dest: "{{ resolver_home }}/constraints.txt"
    owner: "{{ resolver_user }}"
    group: "{{ resolver_group }}"
    mode: "0644"
  notify: Restart content-resolver

# A wheel's contents are decided by packaging metadata, so build debris
# (__pycache__, egg-info) and modules deleted from the repo can't travel.
# --force-reinstall because the version stays 0.1.0 between deploys and pip
# would otherwise treat the already-installed package as satisfying it.
- name: Install the resolver into a venv
  ansible.builtin.pip:
    name: "{{ resolver_home }}/{{ resolver_wheel_find.files[0].path | basename }}"
    virtualenv: "{{ resolver_venv }}"
    virtualenv_command: python3 -m venv
    extra_args: "--force-reinstall --constraint {{ resolver_home }}/constraints.txt"
  notify: Restart content-resolver

- name: Own the install tree
  ansible.builtin.file:
    path: "{{ resolver_home }}"
    state: directory
    owner: "{{ resolver_user }}"
    group: "{{ resolver_group }}"
    recurse: true

# force: false — the on-box file is the LIVE source of truth (the service
# rewrites it via POST/DELETE /override), so this copy seeds a first boot and
# never clobbers API-written entries. Snapshot the live registry back with:
#   curl 'http://<box>:8090/override?raw=1' > deploy/overrides.toml
# No restart handler on purpose: the resolver reloads on mtime change. The
# "Own the install tree" chown above keeps the dir service-writable, so the
# service's atomic replace works even over a root-owned hand-edited file.
- name: Seed the override registry (first boot only, when a site file exists)
  ansible.builtin.copy:
    src: "{{ resolver_overrides_src }}"
    dest: "{{ resolver_overrides_path }}"
    owner: "{{ resolver_user }}"
    group: "{{ resolver_group }}"
    mode: "0640"
    force: false
  when: resolver_overrides_src is exists

- name: Write resolver environment file
  ansible.builtin.template:
    src: config.env.j2
    dest: "{{ resolver_home }}/resolver.env"
    owner: "{{ resolver_user }}"
    group: "{{ resolver_group }}"
    mode: "0640"
  notify: Restart content-resolver

- name: Install systemd unit
  ansible.builtin.template:
    src: content-resolver.service.j2
    dest: /etc/systemd/system/content-resolver.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart content-resolver

- name: Enable and start content-resolver
  ansible.builtin.systemd:
    name: content-resolver
    enabled: true
    state: started
    daemon_reload: true
