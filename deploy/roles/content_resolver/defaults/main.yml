---
resolver_user: resolver
resolver_group: resolver
resolver_home: /opt/content-resolver
resolver_venv: "{{ resolver_home }}/venv"

resolver_bind: 0.0.0.0
resolver_port: 8090

# Gateways the resolver PROBES (on-box, localhost).
resolver_ipfs_internal: "http://127.0.0.1:8080"
resolver_arweave_internal: "http://127.0.0.1:3000"

# Gateway base handed to consumers — must be reachable BY the renderer.
# Some renderers (the FF1 included) cannot resolve .local (mDNS) names,
# so this must be the LAN IP, not a hostname.
resolver_ipfs_public_base: "http://{{ ansible_host }}:8080"
resolver_arweave_public_base: "http://{{ ansible_host }}:3000"

# Operator exception registry (dead canonical ref -> replacement; see
# docs/design.md). The ON-BOX file is the live source of truth — the service
# writes it via POST/DELETE /override — so the site file here (gitignored,
# format: overrides.example.toml) only seeds a first boot; absent, the
# registry starts empty. Snapshot the live registry back to this machine with
# `curl 'http://<box>:8090/override?raw=1' > deploy/overrides.toml`.
resolver_overrides_src: "{{ playbook_dir }}/overrides.toml"
resolver_overrides_path: "{{ resolver_home }}/overrides.toml"

# Household favorites (JSON, written live via /favorites) — box-local operator
# state, not deployed from the repo; starts empty.
resolver_favorites_path: "{{ resolver_home }}/favorites.json"

# /seed captures unhashed HTTP media into Kubo and records provenance in
# <dir>/captures.jsonl. Empty string disables capture.
resolver_capture_dir: "{{ resolver_home }}/captures"
