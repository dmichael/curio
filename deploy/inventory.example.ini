# Copy to inventory.ini and point it at your sidecar host.
#
# The IPFS (Kubo :8080) and Arweave (ar-io-node :3000) gateways are assumed
# already present on this host — this deploy installs only the resolver.
#
# ansible_host should be the box's LAN IP: it is also used as the public base
# of resolved URLs, and renderers like the FF1 cannot resolve .local names.
[content_sidecar]
sidecar ansible_host=192.0.2.10 ansible_user=root ansible_python_interpreter=/usr/bin/python3
