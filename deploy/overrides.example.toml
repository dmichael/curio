# Operator exception registry — dead canonical refs -> replacements.
#
# Copy to overrides.toml (gitignored; entries are site-specific attestations)
# and it seeds the box on FIRST deploy only. After that the on-box file is
# the live source of truth: the service rewrites it on POST/DELETE /override,
# and comments do not survive machine writes. Snapshot the live registry back
# here with: curl 'http://<box>:8090/override?raw=1' > deploy/overrides.toml
# The resolver reloads the file whenever its mtime changes. Substitutions are
# always disclosed in /resolve responses (`substituted`, `substituted_ref`,
# `substitution_status`).
#
# `ref` matches any spelling of the same content: ipfs://CID/path, /ipfs/…,
# gateway URLs, ar://txid/path, arweave.net URLs all canonicalize together.
#
# `status` — provenance tier, strongest evidence first:
#   canonical-recovered  replacement bytes reproduce the recorded CID
#   captured-original    fetched from the canonical URL while it answered
#                        (see /seed capture and captures.jsonl)
#   operator-attested    no hash ever existed; operator attests the copy —
#                        record source and checksum
#   alternate-master     different bytes (e.g. a platform HR master) that do
#                        NOT reproduce the canonical content

[[override]]
ref = "https://dead-domain.example/media/149"        # the canonical reference, as minted
replacement = "ipfs://bafy.../work-149.mp4"          # what to resolve instead (pin it!)
status = "operator-attested"
token = "eip155:1/erc721:0x.../149"                  # provenance metadata, not a lookup key
source = "operator's local copy, archived 2026-07-11; original domain lapsed"
captured = "2026-07-11"
note = "record filename + sha256 of the local copy here"
