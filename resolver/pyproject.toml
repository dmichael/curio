[project]
name = "content-resolver"
version = "0.2.5"
description = "Self-hosted media resolver for IPFS, Arweave, and digital artwork"
authors = [{name = "David Michael"}]
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["ipfs", "arweave", "digital-art", "preservation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "mcp>=1.9,<2",
    "python-multipart>=0.0.9",  # UploadFile parsing; already an mcp transitive dep
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
content-resolver = "resolver.app:main"

[project.urls]
Homepage = "https://github.com/dmichael/curio"
Repository = "https://github.com/dmichael/curio"
Issues = "https://github.com/dmichael/curio/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build"]  # stale setuptools artifacts, not source

[tool.ruff.lint]
# Explicit, version-proof rule set: the classic pyflakes/pycodestyle defaults
# this codebase was written against, plus import sorting. Newer ruff releases
# grow their default set; selecting explicitly keeps CI and local runs stable.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
