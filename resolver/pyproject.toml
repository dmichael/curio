[project]
name = "content-resolver"
version = "0.1.0"
description = "Universal media resolver for the content sidecar — any reference to a box-local playable URL"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "mcp>=1.9,<2",
    "python-multipart>=0.0.9",  # UploadFile parsing; already an mcp transitive dep
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
content-resolver = "resolver.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resolver = ["skill/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build"]  # stale setuptools artifacts, not source

[tool.ruff.lint]
extend-select = ["I"]  # defaults plus import sorting

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
