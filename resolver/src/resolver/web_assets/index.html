<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Curio</title>
  <link rel="stylesheet" href="/web/curio.css?v={{asset_version}}">
</head>
<body>
  <main class="home">
    <h1>Curio</h1>
    <div class="error" role="alert" {{error_hidden}}>
      <strong>Could not resolve that URI.</strong><br><span>{{error}}</span>
    </div>
    <form class="resolve-form" method="post" action="/display">
      <label for="uri">Artwork URI</label>
      <input id="uri" name="uri" type="url" required autofocus value="{{uri}}">
      <div class="form-row">
        <label class="check"><input name="save" type="checkbox" value="on"> Save to Curio</label>
        <button type="submit">Resolve</button>
      </div>
    </form>
  </main>
  <footer class="status-bar">
    <span>Version v{{version}}</span>
    <nav class="links">
      <a href="/docs">API documentation</a>
      <a class="repo-link" href="https://github.com/dmichael/curio">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 .7a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.2.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.6.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.5.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.8 5.4-5.5 5.7.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6A11.5 11.5 0 0 0 12 .7Z"/></svg>
        GitHub
      </a>
    </nav>
  </footer>
</body>
</html>
