name: curio

services:
  resolver:
    image: curio-resolver:0.2.3
    build:
      context: ${CURIO_APP_ROOT:?set CURIO_APP_ROOT}/current/resolver
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "${CURIO_HOST_UID:?set CURIO_HOST_UID}:${CURIO_HOST_GID:?set CURIO_HOST_GID}"
    environment:
      RESOLVER_HOST: 0.0.0.0
      RESOLVER_PORT: "8090"
      RESOLVER_IPFS_INTERNAL: http://kubo:8080
      RESOLVER_IPFS_API: http://kubo:5001
      # All Arweave resolution, storage, and playback uses this Core.
      RESOLVER_ARWEAVE_INTERNAL: http://ar-io-core:4000
      RESOLVER_ARWEAVE_COLD_TIMEOUT: ${CURIO_ARWEAVE_COLD_TIMEOUT:-300}
      RESOLVER_PUBLIC_BASE_URL: ${CURIO_PUBLIC_BASE_URL:-}
      RESOLVER_TRUSTED_PROXY_CIDRS: ${CURIO_TRUSTED_PROXY_CIDRS:-}
      RESOLVER_STATIC_ROOT: /state/media
      RESOLVER_STATIC_CACHE_MAX_BYTES: ${CURIO_STATIC_CACHE_MAX_BYTES:-1000000000}
      RESOLVER_OVERRIDES_PATH: /state/overrides.toml
      RESOLVER_FAVORITES_PATH: /state/favorites.json
    volumes:
      - type: bind
        source: ${CURIO_DATA_ROOT:?set CURIO_DATA_ROOT}
        target: /state
    ports:
      - "${CURIO_PORT:-8090}:8090"
    depends_on:
      kubo: {condition: service_healthy}
      ar-io-core: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    networks: [curio]

  kubo:
    image: ipfs/kubo:v0.40.1@sha256:9c70a3dba0b5f362bf99317a02384a194f5c91cf5388abdb8fe7d64d83dd20bb
    user: "${CURIO_HOST_UID:?set CURIO_HOST_UID}:${CURIO_HOST_GID:?set CURIO_HOST_GID}"
    restart: unless-stopped
    environment:
      IPFS_PATH: /data/ipfs
      IPFS_PROFILE: server
      CURIO_IPFS_STORAGE_MAX: ${CURIO_IPFS_STORAGE_MAX:-20GB}
    volumes:
      - type: bind
        source: ${CURIO_DATA_ROOT}/ipfs
        target: /data/ipfs
      - type: bind
        source: ${CURIO_APP_ROOT}/current/kubo-init.sh
        target: /container-init.d/10-curio-config.sh
        read_only: true
    ports:
      - "4001:4001/tcp"
      - "4001:4001/udp"
    healthcheck:
      test: ["CMD-SHELL", "ipfs --api=/ip4/127.0.0.1/tcp/5001 id >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
    networks: [curio]

  ar-io-core:
    image: ghcr.io/ar-io/ar-io-core:f3032933c6039305bc5ecec0d486526c6d60d6ea@sha256:1155d2042870e6ba2c1457258765c16b762fe66026e4a42799abfca3b5d0d900
    user: "${CURIO_HOST_UID:?set CURIO_HOST_UID}:${CURIO_HOST_GID:?set CURIO_HOST_GID}"
    restart: unless-stopped
    env_file:
      - "${CURIO_DATA_ROOT}/ar-io/start-height.env"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --dns-result-order=ipv4first
      LOG_LEVEL: ${CURIO_AR_IO_LOG_LEVEL:-info}
      LOG_FORMAT: simple
      TRUSTED_NODE_URL: https://arweave.net
      TRUSTED_GATEWAYS_URLS: '{"https://arweave.net":1,"https://ar-io.dev":2,"https://turbo-gateway.com":3,"https://permagate.io":4}'
      ANS104_UNBUNDLE_FILTER: '{"never":true}'
      ANS104_INDEX_FILTER: '{"never":true}'
      ENABLE_BACKGROUND_DATA_VERIFICATION: "false"
      RUN_OBSERVER: "false"
      ON_DEMAND_RETRIEVAL_ORDER: trusted-gateways,ar-io-network,chunks-offset-aware,tx-data
      CHAIN_CACHE_TYPE: lmdb
      ENABLE_CHUNK_DATA_CACHE_CLEANUP: "false"
    volumes:
      - type: bind
        source: ${CURIO_DATA_ROOT}/ar-io
        target: /app/data
    healthcheck:
      test: ["CMD", "/bin/sh", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
    networks: [curio]

networks:
  curio:
    driver: bridge
