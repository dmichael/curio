# Disposable ARM64 Linux appliance test VM for Apple Silicon Macs.
# Create/start from the repository root with:
#   limactl start --name=curio-appliance-test dev/lima.yaml
# The home mount inherited from Lima is read-only; Curio state stays on the
# guest's native filesystem so Linux ownership and atomic writes are real.
minimumLimaVersion: 2.0.0

base:
  - template:docker-rootful

arch: aarch64
vmType: vz
cpus: 4
memory: 6GiB
disk: 60GiB

# Curio has one public HTTP origin. Kubo swarm is intentionally not forwarded
# to the host; qualification checks its guest host binding directly.
portForwards:
  - guestPort: 8090
    hostPort: 13090
    static: true
