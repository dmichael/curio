name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Verify release source
        run: |
          python -m pip install -e "resolver/[dev]" pip-audit==2.10.1
          ruff check resolver
          (cd resolver && pytest)
          pip-audit --requirement resolver/constraints.txt --progress-spinner off
          ./appliance/tests/test-appliance.sh
          ./scripts/check-image-platforms.sh
          docker build --tag curio-resolver:release resolver

      - name: Build release assets
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/install.sh \
            dist/curio-appliance.tar.gz \
            dist/curio-appliance.tar.gz.sha256 \
            dist/VERSION \
            --verify-tag \
            --generate-notes \
            --title "Curio $GITHUB_REF_NAME"
