name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Verify release source
        run: |
          python -m pip install -e "resolver/[dev]" pip-audit==2.10.1
          ruff check resolver
          pytest resolver
          pip-audit --requirement resolver/constraints.txt --progress-spinner off
          ./appliance/tests/test-appliance.sh
          docker build --tag curio-resolver:release resolver

      - name: Build release assets
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/install.sh \
            dist/curio-appliance.tar.gz \
            dist/curio-appliance.tar.gz.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Curio $GITHUB_REF_NAME"
