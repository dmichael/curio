name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolver:
    name: Resolver (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: resolver/pyproject.toml

      - name: Install resolver with development dependencies
        run: python -m pip install -e "resolver/[dev]"

      - name: Lint
        working-directory: resolver
        run: ruff check .

      - name: Test
        working-directory: resolver
        run: pytest

  appliance:
    name: Appliance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test rendered configuration and shell behavior
        run: ./appliance/tests/test-appliance.sh

      - name: Check shell syntax
        run: |
          bash -n appliance/install.sh appliance/curio appliance/kubo-init.sh
          bash -n appliance/tests/test-appliance.sh dev/test-appliance.sh dev/stage-test-releases.sh scripts/check-image-platforms.sh
          sh -n appliance/install.sh appliance/curio appliance/kubo-init.sh

      - name: Compile-check scripts
        run: python -m py_compile scripts/*.py

      - name: Build resolver image
        run: docker build --tag curio-resolver:ci resolver

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Audit locked runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --requirement resolver/constraints.txt --progress-spinner off
